
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Machine Inventory | Equilibrium</title>
<style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f5f5f2;
      color: #222;
      font-family: Arial, sans-serif;
    }

    header {
      background: #24543b;
      color: white;
      padding: 20px;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 15px;
    }

    h1 { margin: 0 0 5px; }

    .panel {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #00000012;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    button, .btn {
      padding: 11px 15px;
      border: none;
      border-radius: 6px;
      background: #24543b;
      color: white;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    .secondary { background: #79533c; }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      padding: 13px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #24543b;
      color: white;
    }

    .available { color: #18783a; }
    .borrowed { color: #9a5800; }

    #qrPanel { text-align: center; }
    #qrcode {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    #qrcode img, #qrcode canvas {
      max-width: 100%;
    }

    #qrUrl {
      overflow-wrap: anywhere;
      font-size: 12px;
    }

    .hidden { display: none; }
    .error { color: #b42318; }

    @media print {
      header, .actions, #inventoryPanel,
      #message, .no-print {
        display: none !important;
      }

      body { background: white; }

      #qrPanel {
        display: block !important;
        box-shadow: none;
        border: 1px solid #222;
        width: 85mm;
        margin: 10mm auto;
      }
    }
  </style>
<link href="./css/enhancements.css" rel="stylesheet"/><link href="./css/app-theme.css" rel="stylesheet"/></head>
<body class="app-page">
<header>
<h1>Machine Inventory</h1>
<div>Equilibrium Intertrade</div>
</header>
<main>
<div class="actions">
<a class="btn utility-back" href="./dashboard.html">← Back</a>
<button id="refreshBtn" type="button">
      Refresh Inventory
    </button>
</div>
<p id="message" role="status"></p>
<section class="panel" id="inventoryPanel">
<h2>Registered Machines</h2>
<input id="searchInput" placeholder="Search machine name, asset ID, or serial number"/>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Asset ID</th>
<th>Machine Name</th>
<th>Serial Number</th>
<th>Location</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="machineTable">
<tr>
<td colspan="6">Loading machines...</td>
</tr>
</tbody>
</table>
</div>
</section>
<section class="panel hidden" id="qrPanel">
<h2>Equilibrium Intertrade</h2>
<h3 id="qrMachineName"></h3>
<p id="qrAssetCode"></p>
<p id="qrSerial"></p>
<div id="qrcode"></div>
<p>SCAN FOR MACHINE INFORMATION</p>
<p id="qrUrl"></p>
<button class="no-print" id="printBtn" type="button">
      Print QR Label
    </button>
<button class="secondary no-print" id="closeQrBtn" type="button">
      Close
    </button>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="./js/inventory.js" type="module"></script>
<div class="quick-add" hidden="">
<nav aria-label="Add new record" class="quick-add-menu" hidden="" id="quickAddMenu">
<a href="./register.html">☕ Register Machine</a>
<a href="./accessories.html">🔧 Register Accessories</a>
<a href="./delivery.html">🚚 For Delivery to Client</a>
</nav>
<button aria-controls="quickAddMenu" aria-expanded="false" aria-label="Add inventory or delivery" class="fab-add" id="quickAddButton" type="button">+</button>
<span class="quick-add-label">Add new</span>
</div>
<script src="./js/add-menu.js" type="module"></script>
</body>
</html>
