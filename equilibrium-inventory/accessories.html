<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Accessories | Equilibrium Inventory</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/enhancements.css"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><main class="wide"><section class="entry-panel"><a href="./dashboard.html">← Back to Dashboard</a><h1>Accessories Inventory</h1><p>Register and track equipment accessories and quantities.</p><form id="accessoryForm"><label for="name">Accessory Name *</label><input id="name" maxlength="160" placeholder="Example: 18g Portafilter Basket" required><label for="sku">SKU / Item Code *</label><input id="sku" maxlength="80" placeholder="Example: ACC-001" required><label for="quantity">Quantity *</label><input type="number" id="quantity" min="0" max="1000000" step="1" value="1" required><label for="unit">Unit</label><select id="unit"><option>pcs</option><option>set</option><option>box</option><option>pair</option></select><label for="location">Storage Location</label><input id="location" maxlength="160" placeholder="Main Warehouse"><label for="notes">Remarks</label><textarea id="notes" maxlength="1000"></textarea><button class="action-btn" id="saveBtn" type="submit">Save Accessory</button></form><p class="feedback" id="message" role="status"></p><h2>Registered Accessories</h2><div style="overflow-x:auto"><table><thead><tr><th>Item Code</th><th>Name</th><th>Stock</th><th>Location</th></tr></thead><tbody id="records"><tr><td colspan="4">Loading...</td></tr></tbody></table></div></section></main><script type="module" src="./js/accessories.js"></script></body></html>
