<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><title>Accessories | Equilibrium Inventory</title><link href="./css/style.css" rel="stylesheet"/><link href="./css/enhancements.css" rel="stylesheet"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="./css/app-theme.css" rel="stylesheet"/></head><body class="app-page"><main class="wide"><section class="entry-panel"><a href="./dashboard.html">← Back to Dashboard</a><h1>Accessories Inventory</h1><p>Register and track equipment accessories and quantities.</p><form id="accessoryForm"><label for="name">Accessory Name *</label><input id="name" maxlength="160" placeholder="Example: 18g Portafilter Basket" required=""/><label for="sku">SKU / Item Code *</label><input id="sku" maxlength="80" placeholder="Example: ACC-001" required=""/><label for="quantity">Quantity *</label><input id="quantity" max="1000000" min="0" required="" step="1" type="number" value="1"/><label for="unit">Unit</label><select id="unit"><option>pcs</option><option>set</option><option>box</option><option>pair</option></select><label for="location">Storage Location</label><input id="location" maxlength="160" placeholder="Main Warehouse"/><label for="notes">Remarks</label><textarea id="notes" maxlength="1000"></textarea><button class="action-btn" id="saveBtn" type="submit">Save Accessory</button></form><p class="feedback" id="message" role="status"></p><h2>Registered Accessories</h2><div style="overflow-x:auto"><table><thead><tr><th>Item Code</th><th>Name</th><th>Stock</th><th>Location</th></tr></thead><tbody id="records"><tr><td colspan="4">Loading...</td></tr></tbody></table></div></section></main><script src="./js/accessories.js" type="module"></script></body></html>
