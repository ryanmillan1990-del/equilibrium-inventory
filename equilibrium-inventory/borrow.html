
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Borrow Machine | Equilibrium Intertrade</title>
<link href="./css/style.css" rel="stylesheet"/>
<style>
    body {
      background: #f5f5f2;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .borrow-container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #00000015;
    }

    h1, h2 { color: #24543b; }

    .subtitle {
      color: #79533c;
    }

    .machine-box {
      padding: 16px;
      background: #e9f1e9;
      border-left: 5px solid #24543b;
      border-radius: 8px;
      margin: 20px 0;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 6px;
      box-sizing: border-box;
      font: inherit;
    }

    textarea { min-height: 85px; }

    button {
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #24543b;
      color: white;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    .back-link {
      color: #79533c;
      display: inline-block;
      margin-bottom: 15px;
    }

    .error { color: #b42318; }
    .success { color: #176b38; }
  </style>
<link href="./css/enhancements.css" rel="stylesheet"/></head>
<body>
<main class="borrow-container">
<a class="back-link" href="./machines.html" id="backLink">
    ← Back to Machine Details
  </a>
<h1>Borrow Machine</h1>
<p class="subtitle">
    Equilibrium Intertrade Corp.
  </p>
<p id="message" role="status">
    Loading machine information...
  </p>
<section hidden="" id="borrowContent">
<div class="machine-box">
<h2 id="machineName"></h2>
<p id="assetCode"></p>
<p id="serialNumber"></p>
<strong id="machineStatus"></strong>
</div>
<form id="borrowForm">
<div class="field">
<label for="borrowerName">
          Borrower Name *
        </label>
<input id="borrowerName" maxlength="150" required=""/>
</div>
<div class="field">
<label for="organization">
          Company / Department
        </label>
<input id="organization" maxlength="150"/>
</div>
<div class="field">
<label for="contactNumber">
          Contact Number
        </label>
<input id="contactNumber" maxlength="30" type="tel"/>
</div>
<div class="field">
<label for="purpose">
          Purpose of Borrowing
        </label>
<textarea id="purpose" maxlength="1000"></textarea>
</div>
<div class="field">
<label for="dueAt">
          Expected Return Date and Time *
        </label>
<input id="dueAt" required="" type="datetime-local"/>
</div>
<button id="borrowButton" type="submit">
        Confirm Borrowing
      </button>
</form>
</section>
</main>
<script src="./js/borrow.js" type="module"></script>
</body>
</html>
