
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register Machine | Equilibrium Inventory</title>
<link href="./css/style.css" rel="stylesheet"/>
<style>
    body {
      background: #f5f5f2;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .registration-container {
      max-width: 650px;
      margin: 45px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 15px #00000014;
    }

    h1 { color: #24543b; }

    .subtitle {
      color: #79533c;
      margin-bottom: 25px;
    }

    .field { margin-bottom: 17px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .save-btn {
      padding: 13px 20px;
      background: #24543b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .save-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #79533c;
    }
  </style>
<link href="./css/enhancements.css" rel="stylesheet"/></head>
<body>
<div class="registration-container">
<a class="back-link" href="./dashboard.html">
      ← Back to Dashboard
    </a>
<h1>Register New Machine</h1>
<p class="subtitle">
      Equilibrium Intertrade Inventory System
    </p>
<form id="machineForm">
<div class="field">
<label>Machine Name *</label>
<input id="machineName" maxlength="150" placeholder="Example: JL22 Coffee Machine" required=""/>
</div>
<div class="field">
<label>Serial Number *</label>
<input id="serialNumber" maxlength="120" placeholder="Enter machine serial number" required=""/>
</div>
<div class="field">
<label>Brand</label>
<input id="brand" placeholder="Example: Jetinno"/>
</div>
<div class="field">
<label>Category</label>
<input id="category" placeholder="Example: Coffee Machine"/>
</div>
<div class="field">
<label>Location</label>
<input id="location" placeholder="Example: Main Warehouse"/>
</div>
<button class="save-btn" id="saveButton" type="submit">
        Register Machine
      </button>
</form>
<p aria-live="polite" id="message" role="status"></p>
</div>
<script src="./js/register.js" type="module"></script>
</body>
</html>
