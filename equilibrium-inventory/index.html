<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equilibrium Inventory — Staff Access</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/enhancements.css"><link rel="stylesheet" href="css/staff.css"></head>
<body><main class="card staff-login"><h1>Equilibrium Intertrade</h1><p class="subtitle">Machine Inventory &amp; Loaner Management</p>
<div class="staff-tabs" role="tablist" aria-label="Staff account access"><button id="login-tab" role="tab" aria-selected="true" type="button">Sign In</button><button id="register-tab" role="tab" aria-selected="false" type="button">Register</button></div>
<section id="login-section"><h2>Staff Login</h2><form id="login"><label>Email<input autocomplete="username" id="email" required type="email"></label><label>Password<input autocomplete="current-password" id="password" required type="password"></label><button id="submit" type="submit">Sign in</button></form><p class="hint">Only approved staff can access inventory.</p></section>
<section id="register-section" hidden><h2>Request Staff Account</h2><form id="registration"><label>Full name<input id="full-name" autocomplete="name" maxlength="100" required placeholder="e.g. Ryan Millan"></label><label>Role requested<select id="requested-role"><option value="TECHNICAL">Technical Staff</option><option value="ADMIN">Administrator</option></select></label><label>Generated login email<input id="generated-email" readonly placeholder="full_name@equinventory.com"></label><label>Create password (12+ characters)<input id="new-password" type="password" autocomplete="new-password" minlength="12" required></label><label>Confirm password<input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required></label><button type="submit" id="register-submit">Submit registration request</button></form><p class="hint">Requests need approval by an existing administrator. The generated email is an internal login ID, not a real mailbox.</p></section>
<p id="message" role="status" aria-live="polite"></p></main><script type="module" src="js/login.js"></script></body></html>
