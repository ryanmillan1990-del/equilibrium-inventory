
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Return Machine | Equilibrium</title>
<link href="./css/style.css" rel="stylesheet"/>
<style>
    body {
      background: #f5f5f2;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .return-container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #00000015;
    }

    h1, h2 {
      color: #24543b;
    }

    .subtitle,
    .back-link {
      color: #79533c;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
    }

    .machine-box {
      background: #edf3ed;
      padding: 18px;
      border-left: 5px solid #24543b;
      border-radius: 8px;
      margin: 20px 0;
    }

    .detail {
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .field {
      margin: 18px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 6px;
      box-sizing: border-box;
      font: inherit;
    }

    textarea {
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #24543b;
      color: white;
      border: none;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .warning {
      color: #79533c;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #176b38;
    }
  </style>
<link href="./css/enhancements.css" rel="stylesheet"/><link href="./css/app-theme.css" rel="stylesheet"/></head>
<body class="app-page">
<main class="return-container">
<a class="back-link" href="./machines.html" id="backLink">
     ← Back to Machine Details
  </a>
<h1>Return Request</h1>
<p class="subtitle">
    Equilibrium Intertrade Corp.
  </p>
<p id="message" role="status">
    Loading active loan...
  </p>
<section hidden="" id="returnContent">
<div class="machine-box">
<h2 id="machineName"></h2>
<p id="assetCode"></p>
<p id="serialNumber"></p>
<strong id="machineStatus"></strong>
</div>
<h2>Current Borrowing Details</h2>
<div class="detail">
<strong>Borrower:</strong>
<span id="borrowerName"></span>
</div>
<div class="detail">
<strong>Company:</strong>
<span id="organization"></span>
</div>
<div class="detail">
<strong>Date Borrowed:</strong>
<span id="borrowedAt"></span>
</div>
<div class="detail">
<strong>Expected Return:</strong>
<span id="dueAt"></span>
</div>
<form id="returnForm">
<div class="field">
<label for="conditionIn">
          Machine Condition Upon Return *
        </label>
<select id="conditionIn" required="">
<option value="">Select condition</option>
<option value="GOOD">Good</option>
<option value="NEEDS_INSPECTION">
            Needs Inspection
          </option>
<option value="DAMAGED">Damaged</option>
</select>
</div>
<div class="field">
<label for="remarks">
          Return Remarks
        </label>
<textarea id="remarks" maxlength="2000" placeholder="Machine condition, missing accessories, issues found..."></textarea>
</div>
<p class="warning">
        Returning a damaged machine or one needing
        inspection will place it under maintenance.
      </p>
<button id="returnButton" type="submit">Send Return Request to Admin</button>
</form>
</section>
</main>
<script src="./js/return.js" type="module"></script>
</body>
</html>
