
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Machine Details | Equilibrium Intertrade</title>
<link href="./css/style.css" rel="stylesheet"/>
<style>
    body {
      background: #f5f5f2;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .details-container {
      max-width: 700px;
      margin: 45px auto;
      padding: 28px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 15px #00000014;
    }

    h1, h2 { color: #24543b; }

    .subtitle { color: #79533c; }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #79533c;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .detail-row span { color: #666; }
    .detail-row strong { text-align: right; }

    .status {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 20px;
      font-weight: bold;
      background: #ececec;
    }

    .available {
      background: #e0f3e6;
      color: #176b38;
    }

    .borrowed {
      background: #fff0d5;
      color: #885400;
    }

    .actions { margin-top: 25px; }

    .action-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #24543b;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .action-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .notice { color: #79533c; }
    .error { color: #b42318; }
  </style>
<link href="./css/enhancements.css" rel="stylesheet"/><link href="./css/app-theme.css" rel="stylesheet"/></head>
<body class="app-page">
<main class="details-container">
<a class="back-link" href="./machines.html">
      ← Back to Inventory
    </a>
<h1>Machine Details</h1>
<p class="subtitle">
      Equilibrium Intertrade Corp.
    </p>
<p id="message" role="status">
      Loading machine information...
    </p>
<section hidden="" id="machineContent">
<h2 id="machineName"></h2>
<div class="detail-row">
<span>Asset ID</span>
<strong id="assetCode"></strong>
</div>
<div class="detail-row">
<span>Serial Number</span>
<strong id="serialNumber"></strong>
</div>
<div class="detail-row">
<span>Brand</span>
<strong id="brand"></strong>
</div>
<div class="detail-row">
<span>Category</span>
<strong id="category"></strong>
</div>
<div class="detail-row">
<span>Location</span>
<strong id="location"></strong>
</div>
<div class="detail-row">
<span>Condition</span>
<strong id="condition"></strong>
</div>
<div class="detail-row">
<span>Status</span>
<strong class="status" id="status"></strong>
</div>
<div class="actions">
<button class="action-btn" disabled="" hidden="" id="borrowBtn" type="button">
          Borrow Machine
        </button>
<button class="action-btn" disabled="" hidden="" id="returnBtn" type="button">
          Return Machine
        </button>
<p class="notice" id="actionNotice"></p>
</div>
</section>
</main>
<script src="./js/machine-details.js" type="module"></script>
<a aria-label="Register new machine" class="fab-add" href="./register.html" title="Register new machine">+</a></body>
</html>
