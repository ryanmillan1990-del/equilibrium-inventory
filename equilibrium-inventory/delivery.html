<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Client Deliveries | Equilibrium Inventory</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/enhancements.css"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><main class="wide"><section class="entry-panel"><a href="./dashboard.html">← Back to Dashboard</a><h1>For Delivery to Client</h1><p>Record outbound delivery requests. This does not automatically deduct stock or mark machines borrowed.</p><form id="deliveryForm"><label for="clientName">Client / Company Name *</label><input id="clientName" maxlength="160" required><label for="clientContact">Client Contact</label><input id="clientContact" maxlength="160"><label for="deliveryAddress">Delivery Address *</label><textarea id="deliveryAddress" maxlength="600" required></textarea><label for="itemType">Item Type *</label><select id="itemType" required><option value="MACHINE">Machine</option><option value="ACCESSORY">Accessory</option></select><label for="itemName">Item Name / Description *</label><input id="itemName" maxlength="160" required><label for="itemCode">Asset ID / SKU (optional)</label><input id="itemCode" maxlength="100"><label for="quantity">Quantity *</label><input id="quantity" type="number" min="1" step="1" max="1000000" value="1" required><label for="deliveryDate">Planned Delivery Date *</label><input id="deliveryDate" type="date" required><label for="remarks">Remarks</label><textarea id="remarks" maxlength="1000"></textarea><button class="action-btn" id="saveBtn" type="submit">Save Delivery Request</button></form><p class="feedback" id="message" role="status"></p><h2>Recent Delivery Requests</h2><div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Client</th><th>Item</th><th>Quantity</th><th>Status</th></tr></thead><tbody id="records"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></section></main><script type="module" src="./js/delivery.js"></script></body></html>
